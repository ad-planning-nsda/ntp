<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — Trainer Database Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-brand mb-4 shadow-sm">
  <div class="container">
    <span class="navbar-brand"><i class="bi bi-person-badge me-2"></i>Trainer Database Portal</span>
    <div class="d-flex align-items-center text-white">
      <span class="me-3 d-none d-sm-inline small" id="whoami"></span>
      <button class="btn btn-outline-light btn-sm" id="logoutBtn"><i class="bi bi-box-arrow-right me-1"></i>Logout</button>
    </div>
  </div>
</nav>

<div class="container pb-5">

  <div class="d-flex flex-wrap justify-content-between align-items-start mb-3 gap-2">
    <div>
      <h5 class="fw-bold mb-1">Applicant Records</h5>
      <div class="text-muted small" id="totalCount">Loading…</div>
    </div>
    <div class="d-flex gap-2 flex-wrap">
      <div class="input-group" style="max-width: 260px;">
        <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
        <input type="text" class="form-control" id="searchInput" placeholder="Search name or email">
      </div>
      <div class="dropdown">
        <button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
          <i class="bi bi-download me-1"></i>Download
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="#" onclick="event.preventDefault(); doExport('all')">All Applicants</a></li>
          <li><a class="dropdown-item" href="#" onclick="event.preventDefault(); doExport('pending')">Pending</a></li>
          <li><a class="dropdown-item" href="#" onclick="event.preventDefault(); doExport('Recommended')">Recommended</a></li>
          <li><a class="dropdown-item" href="#" onclick="event.preventDefault(); doExport('Not Recommended')">Not Recommended</a></li>
        </ul>
      </div>
    </div>
  </div>

  <!-- Status filter tabs (5 options) -->
  <ul class="nav status-tabs mb-3" id="statusTabs">
    <li class="nav-item">
      <a class="nav-link active" href="#" data-status="all" onclick="return selectStatus(event,'all')">All <span class="badge bg-secondary" id="cnt-all">0</span></a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="#" data-status="pending" onclick="return selectStatus(event,'pending')">Pending <span class="badge bg-secondary" id="cnt-pending">0</span></a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="#" data-status="Recommended" onclick="return selectStatus(event,'Recommended')">Recommended <span class="badge bg-success" id="cnt-Recommended">0</span></a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="#" data-status="Not Recommended" onclick="return selectStatus(event,'Not Recommended')">Not Recommended <span class="badge bg-danger" id="cnt-NotRecommended">0</span></a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="#" data-status="reviewed" onclick="return selectStatus(event,'reviewed')">Reviewed <span class="badge bg-secondary" id="cnt-reviewed">0</span></a>
    </li>
  </ul>

  <!-- Desktop / tablet table -->
  <div class="card d-none d-md-block">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Email</th>
            <th>Status</th>
            <th class="text-end">Action</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="5" class="text-center py-5"><div class="spinner-border text-primary"></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Mobile card list -->
  <div class="d-md-none" id="cardList">
    <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
  </div>

  <nav class="mt-4">
    <ul class="pagination justify-content-center flex-wrap" id="pagination"></ul>
  </nav>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script>
  Session.requireAuth();
  configureCheck();

  document.getElementById("whoami").textContent = `${Session.name()}${Session.designation() ? " · " + Session.designation() : ""}`;
  document.getElementById("logoutBtn").addEventListener("click", () => {
    Session.clear();
    window.location.href = "index.html";
  });

  const PAGE_SIZE = 15;
  let currentPage = 1;
  let currentSearch = "";
  let currentStatus = "all";
  let searchDebounce;

  function statusBadge(action) {
    if (action === "Recommended") return `<span class="badge badge-recommended">Recommended</span>`;
    if (action === "Not Recommended") return `<span class="badge badge-not-recommended">Not Recommended</span>`;
    return `<span class="badge badge-pending">Pending</span>`;
  }

  function selectStatus(e, status) {
    e.preventDefault();
    currentStatus = status;
    document.querySelectorAll("#statusTabs .nav-link").forEach(a => a.classList.remove("active"));
    e.currentTarget.classList.add("active");
    loadRows(1);
    return false;
  }

  function updateCounts(counts) {
    if (!counts) return;
    document.getElementById("cnt-all").textContent = counts.all ?? 0;
    document.getElementById("cnt-pending").textContent = counts.pending ?? 0;
    document.getElementById("cnt-Recommended").textContent = counts.Recommended ?? 0;
    document.getElementById("cnt-NotRecommended").textContent = counts["Not Recommended"] ?? 0;
    document.getElementById("cnt-reviewed").textContent = counts.reviewed ?? 0;
  }

  async function loadRows(page = 1) {
    currentPage = page;
    const tbody = document.getElementById("tableBody");
    const cardList = document.getElementById("cardList");
    tbody.innerHTML = `<tr><td colspan="5" class="text-center py-5"><div class="spinner-border text-primary"></div></td></tr>`;
    cardList.innerHTML = `<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>`;
    try {
      const res = await Api.getRows({ page, pageSize: PAGE_SIZE, search: currentSearch, status: currentStatus });
      if (!res.success) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center text-danger py-4">${res.message || "Failed to load"}</td></tr>`;
        cardList.innerHTML = `<div class="text-center text-danger py-4">${res.message || "Failed to load"}</div>`;
        return;
      }
      updateCounts(res.counts);
      document.getElementById("totalCount").textContent = `${res.total} record${res.total === 1 ? "" : "s"} in this view`;

      if (res.rows.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-4">No records found</td></tr>`;
        cardList.innerHTML = `<div class="text-center text-muted py-4">No records found</div>`;
      } else {
        tbody.innerHTML = res.rows.map((r, i) => `
          <tr>
            <td>${(page - 1) * PAGE_SIZE + i + 1}</td>
            <td class="fw-semibold">${escapeHtml(r.nameEn || r.nameBn || "—")}</td>
            <td>${escapeHtml(r.email || "—")}</td>
            <td>${statusBadge(r.action)}</td>
            <td class="text-end">
              <button class="btn btn-sm btn-brand" onclick="viewDetails(${r.rowIndex})">
                <i class="bi bi-eye me-1"></i>View Details
              </button>
            </td>
          </tr>
        `).join("");

        cardList.innerHTML = res.rows.map((r, i) => `
          <div class="card applicant-card mb-2">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-start">
                <div>
                  <div class="fw-semibold">${escapeHtml(r.nameEn || r.nameBn || "—")}</div>
                  <div class="text-muted small">${escapeHtml(r.email || "—")}</div>
                </div>
                ${statusBadge(r.action)}
              </div>
              <button class="btn btn-sm btn-brand w-100 mt-3" onclick="viewDetails(${r.rowIndex})">
                <i class="bi bi-eye me-1"></i>View Details
              </button>
            </div>
          </div>
        `).join("");
      }

      renderPagination(res.total, page);
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="5" class="text-center text-danger py-4">Could not reach server. Check assets/config.js.</td></tr>`;
      cardList.innerHTML = `<div class="text-center text-danger py-4">Could not reach server.</div>`;
    }
  }

  function renderPagination(total, page) {
    const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    const pag = document.getElementById("pagination");
    let html = "";

    const addItem = (label, targetPage, disabled, active) => {
      html += `<li class="page-item ${disabled ? "disabled" : ""} ${active ? "active" : ""}">
        <a class="page-link" href="#" onclick="event.preventDefault(); ${disabled ? "" : `loadRows(${targetPage})`}">${label}</a>
      </li>`;
    };

    addItem("«", page - 1, page <= 1, false);

    let start = Math.max(1, page - 2);
    let end = Math.min(totalPages, start + 4);
    start = Math.max(1, end - 4);
    for (let p = start; p <= end; p++) addItem(p, p, false, p === page);

    addItem("»", page + 1, page >= totalPages, false);
    pag.innerHTML = html;
  }

  function viewDetails(rowIndex) {
    window.open(`details.html?row=${rowIndex}`, "_blank");
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (m) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[m]));
  }

  document.getElementById("searchInput").addEventListener("input", (e) => {
    clearTimeout(searchDebounce);
    const val = e.target.value;
    searchDebounce = setTimeout(() => {
      currentSearch = val;
      loadRows(1);
    }, 400);
  });

  async function doExport(status) {
    try {
      const res = await Api.exportRows(status);
      if (!res.success) { alert(res.message || "Export failed"); return; }
      if (res.rows.length === 0) { alert("No records in this category."); return; }
      const label = status === "all" ? "All" : status === "pending" ? "Pending" : status;
      downloadCsv(`Applicants_${label.replace(/\s+/g, "_")}.csv`, res.headers, res.rows);
    } catch (err) {
      alert("Could not reach server.");
    }
  }

  loadRows(1);
</script>
</body>
</html>
