<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trainer Database Portal — Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="assets/style.css" rel="stylesheet">
</head>
<body>

<div class="auth-wrap">
  <div class="card auth-card">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="mb-2"><i class="bi bi-person-badge" style="font-size:2.4rem;color:#0b3d63;"></i></div>
        <h4 class="fw-bold mb-0">Trainer Database Portal</h4>
        <div class="text-muted small">Applicant records & review dashboard</div>
      </div>

      <ul class="nav nav-pills nav-justified mb-4" id="authTabs">
        <li class="nav-item">
          <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#loginPane" type="button">Login</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-bs-toggle="pill" data-bs-target="#registerPane" type="button">Register Admin</button>
        </li>
      </ul>

      <div class="tab-content">
        <!-- LOGIN -->
        <div class="tab-pane fade show active" id="loginPane">
          <div id="loginAlert"></div>
          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label">Username</label>
              <input type="text" class="form-control" id="loginUsername" required autocomplete="username">
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <div class="input-group">
                <input type="password" class="form-control" id="loginPassword" required autocomplete="current-password">
                <button class="btn btn-outline-secondary pw-toggle" type="button" onclick="togglePasswordField('loginPassword','loginPwIcon')">
                  <i class="bi bi-eye" id="loginPwIcon"></i>
                </button>
              </div>
            </div>
            <button type="submit" class="btn btn-brand w-100" id="loginBtn">
              <span class="spinner-border spinner-border-sm d-none" id="loginSpinner"></span>
              Sign In
            </button>
          </form>
        </div>

        <!-- REGISTER -->
        <div class="tab-pane fade" id="registerPane">
          <div id="registerAlert"></div>
          <form id="registerForm">
            <div class="mb-3">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-control" id="regName" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Designation</label>
              <input type="text" class="form-control" id="regDesignation">
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" id="regEmail">
            </div>
            <div class="mb-3">
              <label class="form-label">Username</label>
              <input type="text" class="form-control" id="regUsername" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <div class="input-group">
                <input type="password" class="form-control" id="regPassword" required minlength="4">
                <button class="btn btn-outline-secondary pw-toggle" type="button" onclick="togglePasswordField('regPassword','regPwIcon')">
                  <i class="bi bi-eye" id="regPwIcon"></i>
                </button>
              </div>
            </div>
            <button type="submit" class="btn btn-brand w-100" id="registerBtn">
              <span class="spinner-border spinner-border-sm d-none" id="registerSpinner"></span>
              Create Account
            </button>
          </form>
        </div>
      </div>

      <p class="footer-note text-center mt-4 mb-0">Super admin: <code>ad.planning</code></p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script>
  configureCheck();

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("loginBtn");
    const spinner = document.getElementById("loginSpinner");
    const alertBox = document.getElementById("loginAlert");
    alertBox.innerHTML = "";
    btn.disabled = true; spinner.classList.remove("d-none");
    try {
      const username = document.getElementById("loginUsername").value.trim();
      const password = document.getElementById("loginPassword").value;
      const res = await Api.login(username, password);
      if (res.success) {
        Session.save(res);
        window.location.href = "dashboard.html";
      } else {
        alertBox.innerHTML = `<div class="alert alert-danger py-2">${res.message || "Login failed"}</div>`;
      }
    } catch (err) {
      alertBox.innerHTML = `<div class="alert alert-danger py-2">Could not reach server. Check assets/config.js.</div>`;
    } finally {
      btn.disabled = false; spinner.classList.add("d-none");
    }
  });

  document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("registerBtn");
    const spinner = document.getElementById("registerSpinner");
    const alertBox = document.getElementById("registerAlert");
    alertBox.innerHTML = "";
    btn.disabled = true; spinner.classList.remove("d-none");
    try {
      const payload = {
        name: document.getElementById("regName").value.trim(),
        designation: document.getElementById("regDesignation").value.trim(),
        email: document.getElementById("regEmail").value.trim(),
        username: document.getElementById("regUsername").value.trim(),
        password: document.getElementById("regPassword").value,
      };
      const res = await Api.register(payload);
      if (res.success) {
        alertBox.innerHTML = `<div class="alert alert-success py-2">${res.message}</div>`;
        document.getElementById("registerForm").reset();
      } else {
        alertBox.innerHTML = `<div class="alert alert-danger py-2">${res.message || "Registration failed"}</div>`;
      }
    } catch (err) {
      alertBox.innerHTML = `<div class="alert alert-danger py-2">Could not reach server. Check assets/config.js.</div>`;
    } finally {
      btn.disabled = false; spinner.classList.add("d-none");
    }
  });
</script>
</body>
</html>
