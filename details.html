<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Applicant Details — Trainer Database Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="assets/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-brand mb-4 shadow-sm">
  <div class="container">
    <span class="navbar-brand"><i class="bi bi-person-badge me-2"></i>Trainer Database Portal</span>
    <button class="btn btn-outline-light btn-sm" onclick="window.close()"><i class="bi bi-x-lg me-1"></i>Close Tab</button>
  </div>
</nav>

<div class="container pb-5" id="pageContent" style="display:none;">

  <div class="profile-header mb-4 d-flex flex-column flex-sm-row align-items-sm-center gap-3">
    <div class="avatar-circle" id="avatarInitials">--</div>
    <div>
      <h4 class="fw-bold mb-1" id="profileName">—</h4>
      <div class="opacity-90 small mb-1" id="profileOccupation"></div>
      <div class="opacity-75" id="profileEmail">—</div>
      <div class="opacity-75 small" id="profileSector">—</div>
    </div>
    <div class="ms-sm-auto" id="profileStatusBadge"></div>
  </div>

  <div class="card mb-4">
    <div class="card-header bg-white fw-semibold"><i class="bi bi-person-lines-fill me-2"></i>Personal & Application Information</div>
    <div class="card-body p-0 p-sm-3">
      <table class="table kv-table mb-0" id="fieldsTable">
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div class="card mb-4">
    <div class="card-header bg-white fw-semibold"><i class="bi bi-clipboard2-check me-2"></i>Review</div>
    <div class="card-body">
      <div id="saveAlert"></div>
      <div class="mb-3">
        <label class="form-label d-block fw-semibold">Action</label>
        <div class="btn-group" role="group">
          <input type="radio" class="btn-check" name="actionRadio" id="actRecommended" value="Recommended" autocomplete="off">
          <label class="btn btn-outline-success" for="actRecommended"><i class="bi bi-check-circle me-1"></i>Recommended</label>

          <input type="radio" class="btn-check" name="actionRadio" id="actNotRecommended" value="Not Recommended" autocomplete="off">
          <label class="btn btn-outline-danger" for="actNotRecommended"><i class="bi bi-x-circle me-1"></i>Not Recommended</label>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Remarks</label>
        <textarea class="form-control" id="remarksInput" rows="3" placeholder="Add remarks..."></textarea>
      </div>
      <button class="btn btn-brand" id="saveBtn">
        <i class="bi bi-save me-1"></i>Save
      </button>
    </div>
  </div>

</div>

<div id="loadingBox" class="text-center py-5">
  <div class="spinner-border text-primary"></div>
  <div class="text-muted mt-2">Loading applicant details…</div>
</div>

<div id="errorBox" class="container" style="display:none;">
  <div class="alert alert-danger" id="errorMsg"></div>
</div>

<!-- Document viewer modal -->
<div class="modal fade" id="docModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h6 class="modal-title" id="docModalTitle"><i class="bi bi-file-earmark-text me-2"></i>Document</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="btn-group mb-3 flex-wrap" id="docSwitcher"></div>
        <iframe id="docFrame" src=""></iframe>
      </div>
      <div class="modal-footer">
        <a href="#" target="_blank" rel="noopener" class="btn btn-outline-primary" id="docOpenNewTab">
          <i class="bi bi-box-arrow-up-right me-1"></i>Open in New Tab
        </a>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          <i class="bi bi-x-lg me-1"></i>Close
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Confirm action modal -->
<div class="modal fade" id="confirmModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h6 class="modal-title"><i class="bi bi-question-circle me-2"></i>Confirm Review Decision</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="mb-2">You are about to mark this applicant as:</p>
        <p class="fs-5 fw-bold" id="confirmActionText">—</p>
        <p class="mb-1 text-muted small">Remarks:</p>
        <p id="confirmRemarksText" class="fst-italic">—</p>
        <div class="alert alert-warning small mb-0"><i class="bi bi-exclamation-triangle me-1"></i>This will save immediately to the database.</div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-brand" id="confirmSaveBtn">
          <span class="spinner-border spinner-border-sm d-none" id="confirmSpinner"></span>
          Yes, Save
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script>
  Session.requireAuth();
  configureCheck();

  const params = new URLSearchParams(window.location.search);
  const rowIndex = params.get("row");

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (m) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[m]));
  }

  function fmtValue(v) {
    if (v === null || v === undefined || v === "") return "—";
    return escapeHtml(v);
  }

  function statusBadgeHtml(action) {
    if (action === "Recommended") return `<span class="badge badge-recommended fs-6">Recommended</span>`;
    if (action === "Not Recommended") return `<span class="badge badge-not-recommended fs-6">Not Recommended</span>`;
    return `<span class="badge badge-pending fs-6">Pending</span>`;
  }

  function driveIdFromLink(link) {
    const m = link.match(/[?&]id=([^&]+)/) || link.match(/\/d\/([^/]+)/);
    return m ? m[1] : null;
  }

  const docModal = new bootstrap.Modal(document.getElementById("docModal"));
  let currentDocLinks = [];

  function openDocModalForCol(col) {
    const f = window.__docFields[col];
    if (!f) return;
    openDocModal(f.label, f.links);
  }

  function openDocModal(label, links) {
    currentDocLinks = links;
    document.getElementById("docModalTitle").innerHTML = `<i class="bi bi-file-earmark-text me-2"></i>${escapeHtml(label)}`;
    const switcher = document.getElementById("docSwitcher");
    switcher.innerHTML = links.length > 1
      ? links.map((l, i) => `<button type="button" class="btn btn-sm btn-outline-primary" onclick="showDoc(${i})">File ${i + 1}</button>`).join("")
      : "";
    showDoc(0);
    docModal.show();
  }

  function showDoc(i) {
    const link = currentDocLinks[i];
    const id = driveIdFromLink(link);
    const previewUrl = id ? `https://drive.google.com/file/d/${id}/preview` : link;
    document.getElementById("docFrame").src = previewUrl;
    document.getElementById("docOpenNewTab").href = link;
    document.querySelectorAll("#docSwitcher .btn").forEach((b, idx) => {
      b.classList.toggle("btn-primary", idx === i);
      b.classList.toggle("btn-outline-primary", idx !== i);
    });
  }

  // clear iframe when modal closes so playback/loads stop
  document.getElementById("docModal").addEventListener("hidden.bs.modal", () => {
    document.getElementById("docFrame").src = "";
  });

  let latestAction = "";
  let latestRemarks = "";

  async function load() {
    if (!rowIndex) {
      showError("No applicant specified.");
      return;
    }
    try {
      const res = await Api.getRowDetail(rowIndex);
      if (!res.success) {
        showError(res.message || "Could not load applicant.");
        return;
      }
      render(res);
    } catch (err) {
      showError("Could not reach server. Check assets/config.js.");
    }
  }

  function showError(msg) {
    document.getElementById("loadingBox").style.display = "none";
    document.getElementById("errorBox").style.display = "block";
    document.getElementById("errorMsg").textContent = msg;
  }

  function render(res) {
    document.getElementById("loadingBox").style.display = "none";
    document.getElementById("pageContent").style.display = "block";

    const byCol = {};
    res.fields.forEach(f => byCol[f.col] = f);

    const nameEn = byCol[4] ? byCol[4].value : "";
    const email = byCol[2] ? byCol[2].value : "";
    const sector = byCol[16] ? byCol[16].value : "";
    const occupation = byCol[17] ? byCol[17].value : "";

    document.getElementById("profileName").textContent = nameEn || (byCol[3] ? byCol[3].value : "Applicant");
    document.getElementById("profileOccupation").innerHTML = occupation
      ? `<i class="bi bi-award me-1"></i>${escapeHtml(occupation)}`
      : "";
    document.getElementById("profileEmail").innerHTML = `<i class="bi bi-envelope me-1"></i>${fmtValue(email)}`;
    document.getElementById("profileSector").innerHTML = sector ? `<i class="bi bi-briefcase me-1"></i>${escapeHtml(sector)}` : "";
    document.getElementById("profileStatusBadge").innerHTML = statusBadgeHtml(res.action);

    const initials = (nameEn || "?").trim().split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();
    document.getElementById("avatarInitials").textContent = initials || "?";

    document.title = `${nameEn || "Applicant"} — Trainer Database Portal`;

    // store doc field data on window for modal buttons, keyed by column
    window.__docFields = {};
    res.fields.forEach(f => { if (f.isDoc) window.__docFields[f.col] = f; });

    const tbody = document.querySelector("#fieldsTable tbody");
    tbody.innerHTML = res.fields.map(f => {
      let valueHtml;
      if (f.isDoc) {
        valueHtml = f.links.length
          ? `<button type="button" class="btn btn-sm btn-outline-primary" onclick="openDocModalForCol(${f.col})">
               <i class="bi bi-eye me-1"></i>View Document${f.links.length > 1 ? "s (" + f.links.length + ")" : ""}
             </button>`
          : `<span class="text-muted">Not provided</span>`;
      } else {
        valueHtml = fmtValue(f.value);
      }
      return `<tr>
        <td class="kv-label">${escapeHtml(f.label)}</td>
        <td class="kv-value">${valueHtml}</td>
      </tr>`;
    }).join("");

    if (res.action === "Recommended") document.getElementById("actRecommended").checked = true;
    if (res.action === "Not Recommended") document.getElementById("actNotRecommended").checked = true;
    document.getElementById("remarksInput").value = res.remarks || "";
  }

  const confirmModal = new bootstrap.Modal(document.getElementById("confirmModal"));

  document.getElementById("saveBtn").addEventListener("click", () => {
    const selected = document.querySelector('input[name="actionRadio"]:checked');
    if (!selected) {
      document.getElementById("saveAlert").innerHTML = `<div class="alert alert-warning py-2">Please choose Recommended or Not Recommended first.</div>`;
      return;
    }
    latestAction = selected.value;
    latestRemarks = document.getElementById("remarksInput").value;

    document.getElementById("confirmActionText").textContent = latestAction;
    document.getElementById("confirmActionText").className =
      "fs-5 fw-bold " + (latestAction === "Recommended" ? "text-success" : "text-danger");
    document.getElementById("confirmRemarksText").textContent = latestRemarks || "(none)";
    confirmModal.show();
  });

  document.getElementById("confirmSaveBtn").addEventListener("click", async () => {
    const btn = document.getElementById("confirmSaveBtn");
    const spinner = document.getElementById("confirmSpinner");
    const alertBox = document.getElementById("saveAlert");
    btn.disabled = true; spinner.classList.remove("d-none");
    try {
      const res = await Api.updateAction(rowIndex, latestAction, latestRemarks);
      if (res.success) {
        confirmModal.hide();
        alertBox.innerHTML = `<div class="alert alert-success py-2"><i class="bi bi-check-circle me-1"></i>Saved successfully. Returning to dashboard…</div>`;
        document.getElementById("profileStatusBadge").innerHTML = statusBadgeHtml(latestAction);
        // Refresh the dashboard tab that opened this page, if still open
        try {
          if (window.opener && !window.opener.closed && typeof window.opener.loadRows === "function") {
            window.opener.loadRows(window.opener.currentPage || 1);
          }
        } catch (e) { /* cross-origin or closed opener - ignore */ }
        // Redirect this tab back to the dashboard shortly after saving
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 1200);
      } else {
        alertBox.innerHTML = `<div class="alert alert-danger py-2">${res.message || "Save failed"}</div>`;
      }
    } catch (err) {
      alertBox.innerHTML = `<div class="alert alert-danger py-2">Could not reach server.</div>`;
    } finally {
      btn.disabled = false; spinner.classList.add("d-none");
    }
  });

  load();
</script>
</body>
</html>
